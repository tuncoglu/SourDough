name = "sourdough"
pages_build_output_dir = "SourDoughMobile/dist"
# Matches the deployed project. The previous value here (2026-10-03) was only ever a
# setdefault in configure-pages.py and was never applied, because the download step
# replaced this file before it was read.
compatibility_date = "2026-07-01"

# The REDCARD service binding to the `sourdough-redcard` Worker was removed here on
# purpose. RedCard.Live now runs from tuncoglu/red-card as a Next.js process on the
# home Raspberry Pi at redcard.sourdoughcalculator.uk, so that Worker has no consumer.
# While this binding existed, the Pages project held a reference to the Worker and
# Cloudflare refused to delete either it or its Durable Object namespace, which kept
# its alarm-driven poller spending API-Football quota alongside the Pi.
