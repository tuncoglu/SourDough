name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# RedCard.Live was extracted from this repository into tuncoglu/redcard-live, where
# it is its own Pages project on its own origin. This workflow no longer builds or
# deploys it.
#
# In particular it no longer deploys the `sourdough-redcard` Worker. That Worker is
# shared infrastructure: it owns the live snapshot and the daily provider quota
# counter, and it is now deployed from the RedCard repository. Deploying it from
# here would overwrite newer code with this repository's older copy.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: SourDoughMobile/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: SourDoughMobile

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: SourDoughMobile

      # Also runs the Pages Function tests in ../functions (see jest.config.js).
      - name: Run tests
        run: npx jest --silent
        working-directory: SourDoughMobile

      # The Functions have no npm dependencies; check them with this package's TypeScript.
      - name: Typecheck Pages Functions
        run: npx tsc -p ../functions
        working-directory: SourDoughMobile

      # The calculation package (packages/calc) has none either, and its tests ran above.
      - name: Typecheck calculation package
        run: npx tsc -p ../packages/calc
        working-directory: SourDoughMobile

      - name: Build web export
        run: npx expo export --platform web
        working-directory: SourDoughMobile
        env:
          EXPO_PUBLIC_SITE_URL: ${{ vars.EXPO_PUBLIC_SITE_URL }}
          EXPO_PUBLIC_CF_BEACON_TOKEN: ${{ vars.EXPO_PUBLIC_CF_BEACON_TOKEN }}
          # "1" shows the Ask the baker card; unset keeps it hidden.
          EXPO_PUBLIC_ASSISTANT_ENABLED: ${{ vars.EXPO_PUBLIC_ASSISTANT_ENABLED }}

      - name: Ensure Cloudflare _headers is present
        run: cp -f SourDoughMobile/public/_headers SourDoughMobile/dist/_headers 2>/dev/null || true

      # wrangler.toml in this repository is now the source of truth for the Pages
      # project config. The previous `pages download config` + configure-pages.py
      # dance existed only to re-inject the RedCard service binding that the
      # download clobbered; that binding is still declared in wrangler.toml, so the
      # round trip is no longer needed.
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy SourDoughMobile/dist --project-name=sourdough --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
